<!doctype html><meta charset="utf-8"><title>viewport test</title>
<style>body{margin:0;font:12px monospace}iframe{border:0;display:block}</style>
<div id="out">running...</div>
<div id="frames"></div>
<script>
const WIDTHS=[320,375,768,1024,1440,2560];
const PATHS=(new URLSearchParams(location.search)).get('paths');
const paths=PATHS?PATHS.split(','):['/'];
window.RESULTS=null;
async function run(){
  const frames=document.getElementById('frames');
  frames.innerHTML='';
  const results=[];
  for(const p of paths){
    for(const w of WIDTHS){
      const f=document.createElement('iframe');
      f.style.width=w+'px'; f.style.height='900px';
      f.src=p;
      frames.appendChild(f);
      await new Promise(r=>{f.onload=r; setTimeout(r,15000)});
      await new Promise(r=>setTimeout(r,350));
      let rec={path:p,width:w,error:null};
      try{
        const d=f.contentDocument;
        const de=d.documentElement;
        rec.scrollW=de.scrollWidth;
        rec.clientW=de.clientWidth;
        rec.overflow=de.scrollWidth>de.clientWidth+1;
        if(rec.overflow){
          const bad=[];
          d.querySelectorAll('body *').forEach(el=>{
            const r=el.getBoundingClientRect();
            if(r.right>de.clientWidth+1||r.left<-1){
              bad.push((el.tagName.toLowerCase())+'.'+(el.className&&el.className.baseVal===undefined?String(el.className).split(' ').slice(0,3).join('.'):'')+' r='+Math.round(r.right)+' l='+Math.round(r.left));
            }
          });
          rec.culprits=bad.slice(0,12);
        }
      }catch(e){rec.error=String(e)}
      results.push(rec);
      frames.removeChild(f);
    }
  }
  window.RESULTS=results;
  document.getElementById('out').textContent=JSON.stringify(results);
}
run();
</script>
